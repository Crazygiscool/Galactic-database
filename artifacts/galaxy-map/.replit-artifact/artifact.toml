kind = "web"
previewPath = "/"
title = "Star Wars Galaxy Map"
version = "1.0.0"
id = "artifacts/galaxy-map"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 26225
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/galaxy-map run dev"

[services.env]
PORT = "26225"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/galaxy-map", "run", "build"]
publicDir = "artifacts/galaxy-map/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
